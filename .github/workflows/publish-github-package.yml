name: Publish gem to GitHub Packages

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Approved gem version
        required: true
        type: string
      revision:
        description: Full commit SHA of the checked release source
        required: true
        type: string
      checksum:
        description: SHA-256 of the verified gem
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-github-package
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: "3.4.13"
      - name: Build and verify the approved gem
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          CHECKSUM: ${{ inputs.checksum }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CHECKSUM" =~ ^[0-9a-f]{64}$ ]]
          git merge-base --is-ancestor "$REVISION" HEAD
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$REVISION")
          source_dir=$(mktemp -d)
          git archive "$REVISION" | tar -x -C "$source_dir"
          cd "$source_dir"
          gem_path="$RUNNER_TEMP/byte_batcher-$VERSION.gem"
          gem build byte_batcher.gemspec --strict --output "$gem_path"
          printf '%s  %s\n' "$CHECKSUM" "$gem_path" | sha256sum --check
          ruby -rrubygems/package -e '
            package = Gem::Package.new(ARGV.fetch(0))
            abort "Gem metadata does not match the requested release" unless package.verify &&
              package.spec.name == "byte_batcher" && package.spec.version.to_s == ARGV.fetch(1)
          ' "$gem_path" "$VERSION"
      - name: Publish to Small Primitives on GitHub Packages
        env:
          GEM_HOST_API_KEY: Bearer ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gem push --host https://rubygems.pkg.github.com/smallprimitives "$RUNNER_TEMP/byte_batcher-$VERSION.gem"
